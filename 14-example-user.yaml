# 步骤 12：一个用户的完整资源（示例，实际由控制面的开通 API 生成）
#
# 三个事实必须一致：
#   pod 标签      dsh.corp/user=alice_corp（userId 的 @ 换成 _）
#   pod 注解      dsh.corp/home-claim=dsh-home-<hash>
#   实际挂载      persistentVolumeClaim.claimName 同上
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-home-a1b2c3d4e5f6
  namespace: dsh-users
  labels: { dsh.corp/user: alice_corp }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: dsh-rbd
  resources: { requests: { storage: 30Gi } }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: dsh-alice-tls, namespace: dsh-users }
spec:
  secretName: dsh-alice-tls
  issuerRef: { name: dsh-internal-ca, kind: ClusterIssuer }
  dnsNames: ["alice.dsh.corp"]
  uris: ["spiffe://corp/dsh/user/alice"]
  duration: 720h
  renewBefore: 120h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-alice
  namespace: dsh-users
  labels: { app: dsh-user, dsh.corp/user: alice_corp }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO 卷必须 Recreate
  selector:
    matchLabels: { app: dsh-user, dsh.corp/user: alice_corp }
  template:
    metadata:
      labels: { app: dsh-user, dsh.corp/user: alice_corp, dsh.corp/tier: T1 }
      annotations:
        dsh.corp/home-claim: dsh-home-a1b2c3d4e5f6
        dsh.corp/public-host: alice.dsh.corp
        dsh.corp/principal: alice@corp
        dsh.corp/handle: alice
    spec:
      runtimeClassName: kata-clh-runtime-rs
      serviceAccountName: dsh-workload
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: dsh.corp/dedicated,             operator: Equal,  value: dsh, effect: NoSchedule }
      initContainers:
        - name: init-home
          image: registry.corp/dsh:0.2.1-alpha.4
          command: ["/opt/dsh/init-home.sh"]
          env:
            - name: DSH_USER_ID
              valueFrom: { fieldRef: { fieldPath: "metadata.annotations['dsh.corp/principal']" } }
          volumeMounts:
            - { name: home, mountPath: /data/dsh }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      containers:
        - name: dsh
          image: registry.corp/dsh:0.2.1-alpha.4
          command: ["/opt/dsh/entrypoint.sh"]
          env:
            - { name: DSH_HOME, value: /data/dsh }
            - name: DSH_USER_ID
              valueFrom: { fieldRef: { fieldPath: "metadata.annotations['dsh.corp/principal']" } }
            - name: DSH_LABEL
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['dsh.corp/user']" } }
            - name: DSH_HANDLE
              valueFrom: { fieldRef: { fieldPath: "metadata.annotations['dsh.corp/handle']" } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: "status.podIP" } }
            - name: DSH_PUBLIC_HOST
              valueFrom: { fieldRef: { fieldPath: "metadata.annotations['dsh.corp/public-host']" } }
            - name: CONTROL_URL
              value: http://dsh-control.dsh-system.svc.cluster.local:8080
            - name: PRINCIPAL_URI
              value: spiffe://corp/dsh/user/alice
            - name: CONTROL_TOKEN
              valueFrom: { secretKeyRef: { name: dsh-control-auth, key: register-token } }
            # 名字必须与镜像里 profile 的 apiKeyEnv、control 的 DSH_MODEL_ENV_NAME 一致
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: dsh-model-token-alice, key: token } }
          ports: [{ containerPort: 8443, name: https }]
          volumeMounts:
            - { name: home, mountPath: /data/dsh }
            - { name: tls, mountPath: /tls, readOnly: true }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "4", memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: dsh-home-a1b2c3d4e5f6 }
        - name: tls
          secret: { secretName: dsh-alice-tls, defaultMode: 0400 }
