# 步骤 13：空闲回收器
#
# 唯一会 scale 的组件。路由与业务逻辑都不在这里。
# 判据由活动插件提供（openTurn），本组件只执行结果。
apiVersion: v1
kind: ServiceAccount
metadata: { name: dsh-reaper, namespace: dsh-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: dsh-reaper, namespace: dsh-users }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dsh-reaper, namespace: dsh-users }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dsh-reaper }
subjects:
  - { kind: ServiceAccount, name: dsh-reaper, namespace: dsh-system }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dsh-reaper, namespace: dsh-system, labels: { app: dsh-reaper } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # 单实例即可；多实例会重复 scale，无害但没必要
  selector:
    matchLabels: { app: dsh-reaper }
  template:
    metadata:
      labels: { app: dsh-reaper }
    spec:
      serviceAccountName: dsh-reaper
      containers:
        - name: reaper
          image: registry.corp/dsh-reaper:0.1.0
          env:
            - { name: CONTROL_URL, value: http://dsh-control.dsh-system.svc.cluster.local:8080 }
            - name: CONTROL_TOKEN
              valueFrom: { secretKeyRef: { name: dsh-control-auth, key: router-token } }
            - { name: NAMESPACE, value: dsh-users }
            - { name: IDLE_SECONDS, value: "900" }     # 15 分钟
            - { name: INTERVAL, value: "5" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
