<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Brand}} · {{.Title}}</title>
<link rel="stylesheet" href="/_dsh/assets/base.css">
<script src="/_dsh/assets/starting.js" defer></script>
</head>
<body>
<main class="card" id="starting" data-state="{{.State}}" data-next="{{.Next}}">
  <div class="brand">{{.Brand}}</div>
  <h1>{{.Title}}</h1>
  <p class="detail">{{.Detail}}</p>
  <ol class="steps">
    <li class="done"><span class="dot"></span><span>身份已验证</span></li>
    <li class="active" id="step-work"><span class="dot"></span><span>启动工作区</span></li>
    <li id="step-enter"><span class="dot"></span><span>进入 DSH</span></li>
  </ol>
  <div class="meter"><span></span></div>
  <p class="hint" role="status" aria-live="polite">
    <span id="elapsed">0</span> 秒 · <span id="note">完成后会自动跳转，无需刷新</span>
  </p>
  <button class="ghost" id="retry" type="button" hidden>立即重试</button>
  <p class="foot">遇到问题请联系 IT 服务台。</p>
</main>
</body>
</html>
