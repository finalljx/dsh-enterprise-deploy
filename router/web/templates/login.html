<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Brand}} · 登录</title>
<link rel="stylesheet" href="/_dsh/assets/base.css">
</head>
<body>
<main class="card">
  <div class="brand">{{.Brand}}</div>
  <h1>登录工作区</h1>

  <p class="foot">账号与权限由企业目录统一管理。</p>
</main>
</body>
</html>
